[project]
name = "pylcp-jax"
version = "0.0.1"
description = "GPU-accelerated laser cooling physics: optical Bloch equations, rate equations and batched Monte Carlo trajectories (JAX)"
authors = [
    {name = "Johan Palm", email = "johan.palm2000@gmail.com"},
]
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11, <3.15"  # versions tested in CI
keywords = ["atomic physics", "laser cooling", "optical Bloch equations", "JAX", "GPU"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "diffrax>=0.7.2,<0.8.0",
    "jax>=0.9.1,<0.10.0",
    "numpy",
    "scipy",
    "sympy>=1.14.0",  # Wigner symbols used by pylcp_jax.hamiltonians
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.9.1,<0.10.0"]  # NVIDIA GPU support (CUDA 12)
gratings = ["numba"]                   # needed only for pylcp_jax.gratings
plot = ["matplotlib>=3.10.8"]          # needed only for the built-in plotting helpers

[project.urls]
Source = "https://github.com/palmispojk/pylcp-jax"
"Bug Tracker" = "https://github.com/palmispojk/pylcp-jax/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pylcp_jax"]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-cov>=6.1,<7.0.0",
    "lmfit>=1.3.4,<2.0.0",
    "ruff>=0.15.10,<0.16.0",
    "pyright>=1.1.408,<2.0.0",
    "sympy>=1.14.0,<2.0.0",
]
docs = [
    "sphinx",
    "nbsphinx",
    "ipykernel>=7.2.0,<8.0.0",
    "matplotlib>=3.10.8,<4.0.0",
    "notebook>=7.5.4,<8.0.0",
    "sympy>=1.14.0,<2.0.0",
    "pathos>=0.3.5,<0.4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "D",   # pydocstyle
]
ignore = [
    "D105",  # missing docstring in magic method
    "D107",  # missing docstring in __init__
    "E402",  # module-level import not at top (needed for jax.config.update)
    "E731",  # lambda assignment (common for short physics expressions)
    "E741",  # ambiguous variable name (l, I, O are standard physics notation)
]

[tool.ruff.lint.per-file-ignores]
"pylcp_jax/fields.py" = ["E501"]  # long LaTeX math in docstrings
"tests/**" = ["D"]  # no docstring requirements for tests

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyright]
include = ["pylcp_jax"]
typeCheckingMode = "basic"
reportMissingImports = "warning"

[tool.pytest.ini_options]
addopts = "--cov=pylcp_jax --cov-report=term-missing --cov-fail-under=60"
markers = [
    "slow: marks tests that take more than a few seconds (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a CUDA GPU",
]
filterwarnings = [
    # Diffrax does not officially support complex dtypes; expected when
    # transform_into_re_im=False is used in OBE.
    "ignore:Complex dtype.*support.*Diffrax:UserWarning",
]
